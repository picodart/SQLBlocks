[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlblocks"
version = "0.1.0"
description = "SQL assembler"
readme = "README.md"
license = "LICENSE"
keywords = ["library", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    # Ваши зависимости
    # "requests>=2.25.0",
]

[project.urls]
Homepage = "https://github.com/picodart/SQLBlocks"
Repository = "https://github.com/picodart/SQLBlocks"